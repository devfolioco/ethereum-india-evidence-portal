<!doctype html>
<!-- Source for assets/og-card.png, the link-preview image every page points
     at. Not part of the build: re-render it only when the wording changes.
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
       --hide-scrollbars --window-size=1200,630 \
       --screenshot=assets/og-card.png scripts/og-card.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/tokens.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--color-deep);
    color: var(--color-deep-text);
    font-family: var(--font);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 72px 80px; box-sizing: border-box;
    border-top: 12px solid var(--color-accent-bright);
  }
  .eyebrow { font-size: 26px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-bright); margin: 0; }
  h1 { font-family: var(--font-display); font-weight: 600; font-size: 76px; line-height: 1.05; margin: 28px 0 0; }
  .sub { font-size: 34px; color: var(--color-deep-text-muted); margin: 24px 0 0; }
  .foot { font-size: 24px; color: var(--color-deep-text-muted); border-top: 1px solid var(--color-deep-border); padding-top: 24px; margin: 0; }
</style>
</head>
<body>
  <div>
    <p class="eyebrow">Ethereum/India Institutional Briefing</p>
    <h1>Tokenised settlement in India</h1>
    <p class="sub">What's live, what's legal, where Ethereum fits</p>
  </div>
  <p class="foot">Every figure sourced, dated and tiered T1 to T5</p>
</body>
</html>
