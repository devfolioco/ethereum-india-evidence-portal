name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-vercel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check deployment secrets
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Set deployment commit author
        shell: bash
        env:
          GIT_AUTHOR_NAME: Pratham
          GIT_AUTHOR_EMAIL: pratham@devfolio.co
          GIT_COMMITTER_NAME: Pratham
          GIT_COMMITTER_EMAIL: pratham@devfolio.co
        run: |
          source_sha=$(git rev-parse HEAD)
          # Vercel reads the latest local commit author. Never push this commit.
          git -c commit.gpgsign=false commit --allow-empty -m "ci: deploy source ${source_sha}"
          printf '### Deployment source\n\nSource commit: %s\n\nRunner-only commit: %s\n' \
            "$source_sha" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      # Runs from the repo root: the Vercel project's Root Directory is set to
      # `website`, so Vercel resolves that folder itself.
      - name: Deploy website
        shell: bash
        run: |
          deployment_url=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          printf '### Production deployment\n\n%s\n' "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
